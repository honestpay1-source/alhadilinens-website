<!DOCTYPE html>
<html>
<head>
  <title>Al Hadi Luxury Pret</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      font-family: 'Segoe UI', sans-serif;
      background:#f8f8f8;
    }

    header{
      background:#000;
      color:#fff;
      padding:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header h1{
      margin:0;
      font-size:22px;
      letter-spacing:2px;
    }

    .nav-links a{
      color:white;
      text-decoration:none;
      margin-left:20px;
      font-size:14px;
    }

    .hero{
      text-align:center;
      padding:50px 20px;
      background:#eee;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
      padding:40px;
    }

    .card{
      background:white;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 8px 20px rgba(0,0,0,0.08);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card img{
      width:100%;
      height:300px;
      object-fit:cover;
    }

    .card-content{
      padding:15px;
      text-align:center;
    }

    .price{
      font-weight:bold;
      margin:10px 0;
    }

    button{
      padding:10px;
      width:100%;
      border:none;
      background:black;
      color:white;
      cursor:pointer;
      border-radius:5px;
      transition:0.3s;
    }

    button:hover{
      background:#444;
    }

    /* CART SIDEBAR */
    .cart-panel{
      position:fixed;
      right:-400px;
      top:0;
      width:350px;
      height:100%;
      background:white;
      box-shadow:-5px 0 15px rgba(0,0,0,0.2);
      padding:20px;
      transition:0.4s;
      overflow:auto;
      z-index:1000;
    }

    .cart-panel.active{
      right:0;
    }

    .cart-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .cart-icon{
      cursor:pointer;
    }

    .whatsapp{
      position:fixed;
      bottom:20px;
      right:20px;
      background:#25D366;
      color:white;
      padding:15px;
      border-radius:50%;
      font-size:22px;
      text-decoration:none;
    }

    footer{
      background:#111;
      color:white;
      text-align:center;
      padding:20px;
    }
  </style>
</head>

<body>

<header>
  <h1>AL HADI LUXURY PRET</h1>
  <div class="nav-links">
    <a href="#">New Arrival</a>
    <a href="#">Catalogue</a>
    <a href="#">Under 5k</a>
    <a href="#" onclick="toggleCart()" class="cart-icon">🛒 Cart (<span id="count">0</span>)</a>
  </div>
</header>

<div class="hero">
  <h2>Luxury Collection 2026</h2>
  <p>Premium stitched & embroidered dresses</p>
</div>

<section class="products">

  <div class="card">
    <img src="https://images.unsplash.com/photo-1581044777550-4cfa60707c03">
    <div class="card-content">
      <h3>Luxury Chiffon</h3>
      <div class="price">Rs 9,800</div>
      <button onclick="addToCart('Luxury Chiffon',9800)">Add to Cart</button>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1593032465171-8f4b4b4f5f2e">
    <div class="card-content">
      <h3>Premium Lawn</h3>
      <div class="price">Rs 4,500</div>
      <button onclick="addToCart('Premium Lawn',4500)">Add to Cart</button>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1618354691438-25bc04584c23">
    <div class="card-content">
      <h3>Formal Embroidery</h3>
      <div class="price">Rs 12,200</div>
      <button onclick="addToCart('Formal Embroidery',12200)">Add to Cart</button>
    </div>
  </div>

</section>

<!-- CART PANEL -->
<div class="cart-panel" id="cartPanel">
  <div class="cart-header">
    <h3>Your Cart</h3>
    <span onclick="toggleCart()" style="cursor:pointer;">❌</span>
  </div>
  <div id="cartItems"></div>
  <h4 id="total"></h4>
  <button onclick="checkout()">Checkout via WhatsApp</button>
</div>

<a href="https://wa.me/923190833295" class="whatsapp">💬</a>

<footer>
  © 2026 Al Hadi Luxury Pret
</footer>

<script>
let cart=[];

function toggleCart(){
  document.getElementById("cartPanel").classList.toggle("active");
}

function addToCart(name,price){
  cart.push({name,price});
  document.getElementById("count").innerText=cart.length;
  renderCart();
}

function renderCart(){
  let items="";
  let total=0;
  cart.forEach(item=>{
    total+=item.price;
    items+=`<p>${item.name} - Rs ${item.price}</p>`;
  });
  document.getElementById("cartItems").innerHTML=items;
  document.getElementById("total").innerText="Total: Rs "+total;
}

function checkout(){
  let message="Order Details:%0A";
  let total=0;
  cart.forEach(item=>{
    message+=item.name+" - Rs "+item.price+"%0A";
    total+=item.price;
  });
  message+="Total: Rs "+total;
  window.open("https://wa.me/923190833295?text="+message);
}
</script>

</body>
</html>
